name: ci

on:
  push:
    branches: [main]
  pull_request:

# verify.sh runs FIRST, before any pnpm task.
#
# It was previously absent from CI entirely, which meant the 39 rules, 156
# fixtures, corpus hashes, coverage baseline, golden results and benchmark
# would have stopped being continuously checked at exactly the moment
# TypeScript started and the repository began changing daily.

jobs:
  verify:
    name: verify.sh (rules, fixtures, corpus, benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Named explicitly rather than assumed. START-HERE.md used to claim
      # "There is no other setup", and on a clean machine 6 of 9 checks failed
      # purely on the missing interpreter while the document told the reader
      # the failure was telling the truth.
      - name: Install Python dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Run verify.sh
        run: bash verify.sh

  build:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build FIRST, in topological order. Packages consume each other's
      # emitted .d.ts files, so typechecking before building fails to resolve
      # @stratifypro/engine and every downstream error cascades from that one
      # unresolved import. Locally it appeared to pass only because a stale
      # dist/ from an earlier build was still on disk.
      - run: pnpm build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # A software supply chain tool that does not check its own supply chain.
      #
      # This was added after the hosting provider refused a deployment with
      # "Vulnerable version of Next.js detected": Next 15.0.3 carried the
      # middleware authorization bypass, the build was green, 181 tests were
      # green, and verify.sh printed ALL CHECKS PASS. Nothing here looked. An
      # audit then found four more advisories in a transitive postcss, two of
      # them high.
      #
      # --prod only. Dev dependencies do not ship, and a check that goes red on
      # something nobody can be exposed to is a check people learn to ignore.
      # Remediations go in pnpm-workspace.yaml overrides, each with the advisory
      # it answers written beside it.
      - name: Dependencies carry no known vulnerability
        run: pnpm audit --prod

      # The published benchmark is this project's public credential, and it is
      # the one number on the site produced by code rather than by a data file.
      # It lives here rather than in verify.sh because scoring it needs built
      # TypeScript, and verify.sh gates this job.
      - name: The published benchmark reproduces, ours included
        run: python3 scripts/bench-publish.py --check

      # Doc 6 step 2.1 accepts on one sentence: the matcher makes zero outbound
      # calls in a full corpus run. verify.sh plants against the static scan;
      # this is the runtime half, which replaces fetch, XMLHttpRequest, and the
      # node http, https, net, tls and dns entry points with something that
      # throws, then pushes all 5,088 corpus components through the matcher.
      # It needs built TypeScript, which is why it is here and not in verify.sh.
      #
      # This runner has a network. That is the point: the test proves the code
      # does not reach for it even when it is there.
      - name: The advisory matcher makes no outbound call, and the scan proves it
        run: python3 scripts/mirror-mutation-test.py

      # SPEC.md 2.2 accepts on "a direct PostgREST call with firm A's token
      # returns zero of firm B's rows". packages/db/src/rls.test.ts asserts
      # that against real Postgres (PGlite) as a non-owner role; this weakens
      # the policies four ways and requires each weakening to be caught by the
      # test that claims to defend it.
      #
      # It is here rather than in verify.sh because it runs the built suite.
      #
      # An isolation test is the easiest kind to write wrong, because a broken
      # one passes. Connecting as the table owner, or writing a policy that
      # shows nobody anything, both satisfy "firm A sees zero of firm B's
      # rows" while proving nothing.
      - name: A firm cannot reach another firm's rows, and the suite has been seen to fail
        run: python3 scripts/rls-mutation-test.py

      # SPEC.md 1.2 accepts on reading SPDX 2.2 to 3.0.1. SPDX 3.0 is a graph,
      # so it is converted into the shape the rules read, and the risk of that
      # conversion is silent: a field the converter misses and a field the
      # supplier omitted produce the same finding, and only one of them is the
      # supplier's fault.
      #
      # The equivalence test says the same SBOM in 2.3 and 3.0.1 must give
      # identical findings. That is also satisfied by two documents which both
      # fail everything, so this removes each mapping in turn and requires the
      # suite to notice.
      - name: The SPDX 3 converter loses nothing, and the test has been seen to fail
        run: python3 scripts/spdx3-mutation-test.py

      # SPEC.md 2.5 accepts on one sentence: `cosign verify-blob` succeeds
      # against the published public key. That cannot be met by signing with
      # our code and verifying with our code, because both halves can share a
      # mistake and still agree.
      #
      # So this drives the real CLI end to end and hands the result to
      # something that knows nothing about this repository. openssl implements
      # the same primitive cosign does and is present on the runner; cosign
      # itself is a 189 MB binary and is used when installed. The script says
      # which of the two ran, so a green line never implies more than happened.
      - name: A sealed bundle verifies with tools that are not ours
        run: python3 scripts/check-seal-interop.py

      # The dogfood. A checker whose own bill of materials has never been
      # checked is selling something it has not tried. This re-runs the engine
      # over the committed SBOM of this repository and fails if the published
      # page has drifted from what the tool actually says.
      #
      # It lives here rather than in verify.sh because it needs the built CLI,
      # and verify.sh gates this job.
      - name: This tool still says what it says about its own SBOM
        run: python3 scripts/self-sbom.py --check

      # "Zero runtime dependencies" is the answer to "what is in your tool".
      # It is a sales claim and a security claim, so it is enforced rather
      # than intended.
      - name: Engine declares zero runtime dependencies
        run: |
          deps=$(node -p "Object.keys(require('./packages/engine/package.json').dependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "packages/engine declares $deps runtime dependencies; it must declare none"
            exit 1
          fi
          echo "engine: zero runtime dependencies"

      # Nothing flows upward. The engine must stay usable with every package
      # below it absent, because the free browser checker ships the engine and
      # the rule packs alone.
      - name: Engine does not import from apps or sibling packages
        run: |
          if grep -rnE "from '(\.\./)*(apps|packages)/" packages/engine/src; then
            echo "packages/engine imports outside itself"
            exit 1
          fi
          echo "engine: no upward or sibling imports"

      # The engine runs in a browser tab with no network, in CI with no
      # browser, and on a server. Shipped engine code therefore uses no Node
      # built-in. Its own tests may: they read the golden artifact off disk,
      # and a test is not shipped behaviour.
      - name: Engine ships no Node built-in imports
        run: |
          offenders=$(grep -rlE "from 'node:" packages/engine/src --include='*.ts' \
                      | grep -v '\.test\.ts$' || true)
          if [ -n "$offenders" ]; then
            echo "engine source imports Node built-ins:"
            echo "$offenders"
            exit 1
          fi
          echo "engine: no Node built-ins outside tests"
